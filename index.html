<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Dashboard Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="logo">
                <h2>StudyPro</h2>
            </div>
            <ul class="nav-links">
                <li class="active" data-target="dashboard-view">📊 Dashboard</li>
                <li data-target="whiteboard-view">🎨 Whiteboard</li>
                <li data-target="notes-view">📝 Notes</li>
            </ul>
            <div class="sidebar-bottom">
                <button id="theme-toggle" class="btn outline full-width">🌙 Dark Mode</button>
            </div>
        </nav>

        <main class="main-content">
            
            <div id="dashboard-view" class="view active">
                <header class="topbar">
                    <h1>Your Progress Overview</h1>
                </header>
                <div class="dashboard-grid">
                    
                    <section class="card stats-card full-width">
                        <div class="card-header">
                            <h2>Overall Statistics</h2>
                            <button id="reset-stats" class="btn outline btn-sm">Reset Stats</button>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-item"><span class="stat-value" id="stat-tasks">0</span><span class="stat-label">Tasks Done</span></div>
                            <div class="stat-item"><span class="stat-value" id="stat-sessions">0</span><span class="stat-label">Focus Sessions</span></div>
                            <div class="stat-item"><span class="stat-value" id="stat-habits">0</span><span class="stat-label">Active Habits</span></div>
                        </div>
                    </section>

                    <section class="card pomodoro-card">
                        <div class="card-header">
                            <h2>Pomodoro Timer</h2>
                        </div>
                        <div class="timer-display" id="timer-display">25:00</div>
                        <div class="timer-controls">
                            <button id="start-timer" class="btn primary">Start</button>
                            <button id="pause-timer" class="btn secondary">Pause</button>
                            <button id="reset-timer" class="btn outline">Reset Time</button>
                        </div>
                    </section>

                    <section class="card todo-card">
                        <div class="card-header">
                            <h2>To-Do List</h2>
                            <button id="clear-todos" class="btn outline btn-sm">Clear All</button>
                        </div>
                        <div class="input-group">
                            <input type="text" id="todo-input" placeholder="What needs to be done?">
                            <button id="add-todo" class="btn primary">+</button>
                        </div>
                        <ul id="todo-list" class="item-list"></ul>
                    </section>

                    <section class="card habit-card">
                        <div class="card-header">
                            <h2>Habit Tracker</h2>
                            <button id="reset-habits" class="btn outline btn-sm">Reset Streaks</button>
                        </div>
                        <div class="input-group">
                            <input type="text" id="habit-input" placeholder="New daily habit...">
                            <button id="add-habit" class="btn primary">+</button>
                        </div>
                        <ul id="habit-list" class="item-list"></ul>
                    </section>

                    <section class="card goals-card">
                        <div class="card-header">
                            <h2>Long-Term Goals</h2>
                            <button id="clear-goals" class="btn outline btn-sm">Clear All</button>
                        </div>
                        <div class="input-group">
                            <input type="text" id="goal-input" placeholder="Enter a new goal...">
                            <button id="add-goal" class="btn primary">+</button>
                        </div>
                        <ul id="goal-list" class="item-list"></ul>
                    </section>
                </div>
            </div>

            <div id="whiteboard-view" class="view hidden">
                <div class="wb-container">
                    <div class="wb-toolbar">
                        <div class="tool-group">
                            <button class="tool-btn active" id="tool-pencil" title="Pencil">✏️</button>
                            <button class="tool-btn" id="tool-highlighter" title="Highlighter">🖍️</button>
                            <button class="tool-btn" id="tool-eraser" title="Eraser">🧹</button>
                            <button class="tool-btn" id="tool-text" title="Text">T</button>
                        </div>
                        <div class="tool-group">
                            <input type="color" id="wb-color" value="#1f2937" title="Color">
                            <input type="range" id="wb-size" min="1" max="50" value="3" title="Brush Size">
                        </div>
                        <div class="tool-group">
                            <button class="tool-btn" id="wb-undo" title="Undo">↩️</button>
                            <button class="tool-btn" id="wb-redo" title="Redo">↪️</button>
                            <button class="tool-btn" id="wb-clear" title="Clear Canvas">🗑️</button>
                        </div>
                        <div class="tool-group">
                            <button class="tool-btn" id="wb-zoom-out" title="Zoom Out">➖</button>
                            <span id="wb-zoom-level">100%</span>
                            <button class="tool-btn" id="wb-zoom-in" title="Zoom In">➕</button>
                        </div>
                        <div class="tool-group">
                            <button class="btn secondary btn-sm" id="wb-export">Export PNG</button>
                            <label class="btn outline btn-sm" style="cursor:pointer;">
                                Import
                                <input type="file" id="wb-import" accept="image/*" style="display:none;">
                            </label>
                        </div>
                    </div>
                    <div class="canvas-wrapper" id="canvas-wrapper">
                        <canvas id="whiteboard-canvas" width="2000" height="1500"></canvas>
                    </div>
                </div>
            </div>

            <div id="notes-view" class="view hidden">
                <div class="notes-container">
                    <div class="notes-sidebar">
                        <div class="notes-search">
                            <input type="text" id="note-search" placeholder="Search notes...">
                        </div>
                        <div class="folder-section">
                            <div class="section-header">
                                <h3>Folders</h3>
                                <button id="add-folder-btn" class="icon-btn">+</button>
                            </div>
                            <ul id="folder-list" class="folder-list"></ul>
                        </div>
                        <div class="note-list-section">
                            <div class="section-header">
                                <h3>Notes</h3>
                                <button id="add-note-btn" class="icon-btn">+</button>
                            </div>
                            <ul id="note-list" class="note-list"></ul>
                        </div>
                    </div>
                    <div class="editor-area">
                        <div class="editor-toolbar">
                            <button class="ed-btn" data-command="bold" title="Bold"><b>B</b></button>
                            <button class="ed-btn" data-command="italic" title="Italic"><i>I</i></button>
                            <button class="ed-btn" data-command="underline" title="Underline"><u>U</u></button>
                            <button class="ed-btn" id="ed-highlight" title="Highlight">💡</button>
                            <span class="divider"></span>
                            <button class="ed-btn" data-command="insertUnorderedList" title="Bullet List">●</button>
                            <button class="ed-btn" id="ed-checklist" title="Checklist">☑</button>
                            <span class="divider"></span>
                            <button class="ed-btn" id="ed-image" title="Insert Image">🖼️</button>
                        </div>
                        <input type="text" id="note-title-input" class="note-title-input" placeholder="Note Title...">
                        <div id="note-editor" class="note-editor" contenteditable="true" placeholder="Start typing your notes here..."></div>
                    </div>
                </div>
            </div>

        </main>
    </div>
    <div id="text-tool-input" contenteditable="true" class="hidden-text-input"></div>

    <script src="script.js"></script>
</body>
</html>
